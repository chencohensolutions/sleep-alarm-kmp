name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Shared logic tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: sleep-alarm-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      # Open the "debug-latest" release on the phone and tap the APK to install.
      - name: Publish APK to the debug-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk sleep-alarm-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest sleep-alarm-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Tap sleep-alarm-debug.apk to install."
